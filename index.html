<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flash Game</title>

    <!-- Ruffle -->
    <script src="./ruffle/ruffle.js"></script>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        ruffle-player {
            display: block;
            width: 100%;
            height: 100%;
        }

        #error {
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

    <div id="error" hidden></div>

    <script>
        // Get the game name from the URL.
        //
        // Example:
        // https://example.github.io/flash-games/?game=game1.swf
        //
        // The actual SWF will be:
        // games/game1.swf

        const params = new URLSearchParams(window.location.search);
        const game = params.get("game");

        const error = document.getElementById("error");

        if (!game) {
            error.hidden = false;
            error.textContent = "No game was specified.";
        } else {
            // Prevent the parameter from being used as a path
            // outside the games folder.
            if (
                game.includes("..") ||
                game.startsWith("/") ||
                game.includes("\\")
            ) {
                error.hidden = false;
                error.textContent = "Invalid game name.";
            } else {
                const player = document.createElement("ruffle-player");

                player.setAttribute(
                    "src",
                    "./games/" + game
                );

                player.setAttribute("width", "100%");
                player.setAttribute("height", "100%");

                document.body.appendChild(player);
            }
        }
    </script>

</body>
</html>
