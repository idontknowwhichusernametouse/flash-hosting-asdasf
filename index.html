</head>

<body>

<div id="player-container">
    <div id="message">Loading...</div>
</div>

<script>
    window.addEventListener("DOMContentLoaded", function () {

        const params = new URLSearchParams(window.location.search);
        const game = params.get("game");

        const container = document.getElementById("player-container");
        const message = document.getElementById("message");

        if (!game) {
            message.textContent =
                "No game was specified. Add ?game=yourgame.swf to the URL.";
            return;
        }

        // Only allow filenames, not paths outside the games folder.
        if (
            game.includes("..") ||
            game.startsWith("/") ||
            game.includes("\\")
        ) {
            message.textContent = "Invalid game name.";
            return;
        }

        try {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();

            player.style.width = "100%";
            player.style.height = "100%";

            container.innerHTML = "";
            container.appendChild(player);

            player.ruffle().load("./games/" + game);

        } catch (error) {
            console.error("Ruffle error:", error);

            container.innerHTML =
                '<div id="message">Ruffle could not be loaded. Check the browser console for details.</div>';
        }
    });
</script>

</body>
</html>
